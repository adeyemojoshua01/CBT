<!DOCTYPE html>
<html lang="en" style="overflow: hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>University eduCBT</title>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind (via CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                packages: { '[+]': ['mhchem', 'ams'] }
            },
            options: {
                ignoreHtmlClass: 'no-mathjax',
                processHtmlClass: 'mathjax'
            }
        };
    </script>
    <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCsT9juyBRxSxozDwLHJXJIvjM9WLKpHMw",
    authDomain: "educbt-platform.firebaseapp.com",
    projectId: "educbt-platform",
    storageBucket: "educbt-platform.firebasestorage.app",
    messagingSenderId: "556542538133",
    appId: "1:556542538133:web:6a3f8fe97d7c0c0913c69c"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
</script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

    <!-- Initial Data Injection -->
    <script>
        (function(){
            try {
                const s = {
                    "default_subject": {
                        "id": "default_subject",
                        "name": "General Science",
                        "duration": 30,
                        "questions": [
                            {
                                "id": 1,
                                "text": "Science is the systematic study of the natural world based on __________.",
                                "type": "fill",
                                "options": null,
                                "correct": "evidence",
                                "topicId": "general",
                                "explanation": "Science relies on evidence from observations and experiments."
                            },
                            {
                                "id": 2,
                                "text": "The three major branches of science are Physical, Life, and __________ science.",
                                "type": "fill",
                                "options": null,
                                "correct": "earth",
                                "topicId": "general",
                                "explanation": "Earth science includes geology, meteorology, and oceanography."
                            },
                            {
                                "id": 3,
                                "text": "Which is the primary focus of Life Science?",
                                "type": "objective",
                                "options": {
                                    "A": "Physical world",
                                    "B": "Living things",
                                    "C": "Earth history",
                                    "D": "Human behavior"
                                },
                                "correct": "B",
                                "topicId": "general",
                                "explanation": "Life science, or biology, studies living organisms and their processes."
                            }
                        ],

                if (s) localStorage.setItem('cbt_subjects', JSON.stringify(s));

</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden text-gray-800" style="overflow: hidden;">

    <!-- Header -->
    <header class="bg-green-700 text-white p-4 shadow-md z-10">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-graduation-cap text-2xl"></i>
                <h1 class="text-xl font-bold">University eduCBT</h1>
            </div>
            <div id="header-actions">
                <button onclick="event.preventDefault(); app.showLanding()" class="text-sm bg-green-800 hover:bg-green-900 px-3 py-1 rounded flex items-center gap-2">
                    <i class="fas fa-home"></i>
                    <span class="hidden sm:inline">Home</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="flex-grow container mx-auto p-4 overflow-auto relative"></main>

    <!-- Mobile Grid Modal -->
    <div id="mobile-grid-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-4 w-11/12 max-w-sm shadow-xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-bold text-gray-800">Question Navigator</h3>
                <button onclick="event.preventDefault(); document.getElementById('mobile-grid-modal').classList.add('hidden')" class="text-gray-500 hover:text-red-500">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="flex-grow overflow-y-auto p-2" id="mobile-grid-container"></div>
        </div>
    </div>

    <!-- Image Viewer Modal -->
    <div id="image-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-4 w-11/12 max-w-6xl shadow-xl flex flex-col" style="height: 90vh;">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <div>
                    <h3 class="font-bold text-gray-800 text-lg" id="image-modal-title">Reference Images</h3>
                    <p id="image-folder-name" class="text-sm text-gray-500"></p>
                </div>
                <button onclick="event.preventDefault(); imageViewer.close()" class="text-gray-500 hover:text-red-500 text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div id="image-viewer-container" class="flex-grow flex flex-col">
                <!-- Image Toolbar -->
                <div class="image-toolbar">
                    <div class="flex items-center gap-1">
                        <button onclick="imageViewer.zoomIn()" title="Zoom In"><i class="fas fa-search-plus"></i></button>
                        <button onclick="imageViewer.zoomOut()" title="Zoom Out"><i class="fas fa-search-minus"></i></button>
                        <button onclick="imageViewer.downloadAll()" title="Download All Images"><i class="fas fa-download"></i></button>
                    </div>
                    <div class="ml-auto">
                        <span id="image-count" class="text-sm text-gray-600">0 images</span>
                    </div>
                </div>

                <!-- Image Gallery -->
                <div id="image-gallery" class="flex-grow overflow-auto image-gallery"></div>
            </div>

            <!-- No Images Message -->
            <div id="no-images-message" class="hidden h-full flex items-center justify-center">
                <div class="text-center p-8">
                    <i class="fas fa-image text-5xl text-gray-300 mb-4"></i>
                    <h4 class="text-xl font-bold text-gray-500 mb-2">No Images Available</h4>
                    <p class="text-gray-400">No reference images uploaded for this subject.</p>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t flex justify-between items-center">
                <div class="text-sm text-gray-500">
                    <i class="fas fa-info-circle mr-1"></i>
                    Click on any image to view full size
                </div>
                <button onclick="event.preventDefault(); imageViewer.close()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Topic Image Viewer Modal -->
    <div id="topic-image-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-4 w-11/12 max-w-6xl shadow-xl flex flex-col" style="height: 90vh;">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <div>
                    <h3 class="font-bold text-gray-800 text-lg" id="topic-image-modal-title">Topic Images</h3>
                    <p id="topic-image-folder-name" class="text-sm text-gray-500"></p>
                </div>
                <button onclick="event.preventDefault(); document.getElementById('topic-image-modal').classList.add('hidden')" class="text-gray-500 hover:text-red-500 text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="topic-image-gallery" class="flex-grow overflow-auto image-gallery"></div>
            <div class="mt-4 pt-4 border-t text-right">
                <button onclick="event.preventDefault(); document.getElementById('topic-image-modal').classList.add('hidden')" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Close</button>
            </div>
        </div>
    </div>

    <!-- Note Viewer Modal -->
    <div id="note-viewer-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-4xl shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold" id="note-viewer-title">Topic Notes</h2>
                <button onclick="event.preventDefault(); document.getElementById('note-viewer-modal').classList.add('hidden')" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="note-viewer-content" class="prose max-w-none note-content"></div>
            <div class="mt-4 pt-4 border-t text-right">
                <button onclick="event.preventDefault(); document.getElementById('note-viewer-modal').classList.add('hidden')" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Close</button>
            </div>
        </div>
    </div>

    <!-- Full-Screen Explanation Viewer Modal -->
    <div id="fullscreen-explain-modal">
        <div class="modal-content theme-white">
            <button class="theme-toggle-btn" onclick="window.toggleExplanationTheme(this)" title="Change background color">💡</button>
            <button class="close-btn" onclick="document.getElementById('fullscreen-explain-modal').classList.remove('open')">
                <i class="fas fa-times"></i>
            </button>
            <h2>📖 Full Screen Explanation</h2>
            <div id="fullscreen-explain-body"></div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- MAIN APPLICATION JAVASCRIPT (EMBEDDED)                       -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // IMAGE VIEWER MODULE
        // ============================================================

        const imageViewer = {
            images: [],
            scale: 1,

            init: function() {
                this.setupEventListeners();
            },

            setupEventListeners: function() {
                // No admin upload areas – image viewing only
            },

            open: function(images, title) {
                this.images = images || [];
                const modal = document.getElementById('image-modal');
                document.getElementById('image-modal-title').textContent = title || 'Reference Images';
                document.getElementById('image-count').textContent = `${this.images.length} images`;

                if (this.images.length === 0) {
                    document.getElementById('image-viewer-container').classList.add('hidden');
                    document.getElementById('no-images-message').classList.remove('hidden');
                } else {
                    document.getElementById('image-viewer-container').classList.remove('hidden');
                    document.getElementById('no-images-message').classList.add('hidden');
                    this.renderGallery();
                }

                modal.classList.remove('hidden');
            },

            close: function() {
                document.getElementById('image-modal').classList.add('hidden');
                this.images = [];
            },

            renderGallery: function() {
                const gallery = document.getElementById('image-gallery');
                gallery.innerHTML = '';

                this.images.forEach((image) => {
                    const item = document.createElement('div');
                    item.className = 'image-item';
                    item.onclick = () => this.viewFullSize(image.data);

                    const img = document.createElement('img');
                    img.src = image.data;
                    img.alt = image.filename;

                    const filename = document.createElement('div');
                    filename.className = 'filename';
                    filename.textContent = image.filename;

                    item.appendChild(img);
                    item.appendChild(filename);
                    gallery.appendChild(item);
                });
            },

            viewFullSize: function(imageData) {
                const fullscreenModal = document.createElement('div');
                fullscreenModal.className = 'fixed inset-0 bg-black/90 flex items-center justify-center z-[60]';
                fullscreenModal.onclick = () => fullscreenModal.remove();

                const img = document.createElement('img');
                img.src = imageData;
                img.className = 'max-h-[90vh] max-w-[90vw] object-contain';

                fullscreenModal.appendChild(img);
                document.body.appendChild(fullscreenModal);
            },

            zoomIn: function() {
                this.scale += 0.1;
                this.applyZoom();
            },

            zoomOut: function() {
                if (this.scale > 0.3) {
                    this.scale -= 0.1;
                    this.applyZoom();
                }
            },

            applyZoom: function() {
                const images = document.querySelectorAll('.image-item img');
                images.forEach(img => {
                    img.style.transform = `scale(${this.scale})`;
                });
            },

            downloadAll: function() {
                this.images.forEach((image, index) => {
                    const link = document.createElement('a');
                    link.href = image.data;
                    link.download = image.filename || `image-${index + 1}.jpg`;
                    link.click();
                });
                app.showNotification(`Downloading ${this.images.length} images...`, 'success');
            }
        };

        // ============================================================
        // MAIN APP OBJECT – CANDIDATE ONLY
        // ============================================================

        const app = {
            data: {
                subjects: {},
                currentSubjectId: null,
                questions: [],
                examDuration: 30,
                currentQuestionIndex: 0,
                userAnswers: {},
                candidateName: '',
                timer: null,
                timeLeft: 0,
                mode: 'landing',
                results: [],
                images: {},
                examMode: null, // 'practice' or 'study'
                answerRevealed: {},
                lastResults: null,
                refreshLocked: true
            },

            // ============================================================
            // INITIALIZATION
            // ============================================================

            init: function() {
                this.loadData();
                this.loadResults();
                this.loadImages();
                this.showLanding();
                imageViewer.init();
                this.setupMathJaxPatch();
            },

            loadData: function() {
                const storedSubjects = localStorage.getItem('cbt_subjects');
                if (storedSubjects) {
                    this.data.subjects = JSON.parse(storedSubjects);
                    Object.values(this.data.subjects).forEach(subj => {
                        if (!subj.notes) subj.notes = {};
                        if (!subj.topicImages) subj.topicImages = {};
                    });
                } else {
                    this.loadDefaultQuestions();
                }
            },

            loadDefaultQuestions: function() {
                const defaultQuestions = [
                    {
                        id: 1,
                        text: "Science is the systematic study of the natural world based on __________.",
                        type: 'fill',
                        options: null,
                        correct: "evidence",
                        topicId: 'general',
                        explanation: "Science relies on evidence from observations and experiments."
                    },
                    {
                        id: 2,
                        text: "The three major branches of science are Physical, Life, and __________ science.",
                        type: 'fill',
                        options: null,
                        correct: "earth",
                        topicId: 'general',
                        explanation: "Earth science includes geology, meteorology, and oceanography."
                    },
                    {
                        id: 3,
                        text: "Which is the primary focus of Life Science?",
                        type: 'objective',
                        options: { A: "Physical world", B: "Living things", C: "Earth history", D: "Human behavior" },
                        correct: "B",
                        topicId: 'general',
                        explanation: "Life science, or biology, studies living organisms and their processes."
                    }
                ];
                this.createSubjectInternal('General Science', 30, defaultQuestions, 'default_subject');
            },

            loadImages: function() {
                const storedImages = localStorage.getItem('cbt_images');
                if (storedImages) {
                    try {
                        this.data.images = JSON.parse(storedImages);
                    } catch(e) {
                        this.data.images = {};
                    }
                }
            },

            loadResults: function() {
                const storedResults = localStorage.getItem('cbt_results');
                if (storedResults) {
                    try {
                        this.data.results = JSON.parse(storedResults);
                    } catch(e) {}
                }
            },

            saveSubjects: function() {
                localStorage.setItem('cbt_subjects', JSON.stringify(this.data.subjects));
            },

            saveResults: function() {
                localStorage.setItem('cbt_results', JSON.stringify(this.data.results));
                // Trigger verse popup after saving results
                this.showVersePopup();
            },

            saveImages: function() {
                localStorage.setItem('cbt_images', JSON.stringify(this.data.images));
            },

            createSubjectInternal: function(name, duration, questions = [], id = null) {
                const newId = id || 'subj_' + Date.now();
                this.data.subjects[newId] = {
                    id: newId,
                    name: name,
                    duration: parseInt(duration) || 30,
                    questions: questions,
                    topics: [{ id: 'general', name: 'General' }],
                    notes: {},
                    topicImages: {}
                };
                this.saveSubjects();
                return newId;
            },

            // ============================================================
            // NOTIFICATIONS
            // ============================================================

            showNotification: function(message, type = 'info') {
                const existing = document.querySelector('.cbt-notification');
                if (existing) existing.remove();

                const colors = {
                    info: 'bg-blue-100 text-blue-800 border-blue-300',
                    success: 'bg-green-100 text-green-800 border-green-300',
                    warning: 'bg-yellow-100 text-yellow-800 border-yellow-300',
                    error: 'bg-red-100 text-red-800 border-red-300'
                };

                const notification = document.createElement('div');
                notification.className = `cbt-notification fixed top-4 right-4 z-50 p-4 rounded-lg border shadow-lg ${colors[type]}`;
                notification.innerHTML = `
                    <div class="flex items-center gap-3">
                        <i class="fas fa-info-circle"></i>
                        <span class="font-medium">${message}</span>
                        <button onclick="this.parentElement.parentElement.remove()" class="ml-4 text-gray-500 hover:text-gray-700">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;

                document.body.appendChild(notification);

                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.remove();
                    }
                }, 3000);
            },

            // ============================================================
            // LANDING PAGE
            // ============================================================

            showLanding: function() {
                this.stopTimer();
                this.data.mode = 'landing';
                this.data.examMode = null;
                this.updateHeader();

                const subjectsWithNotes = Object.values(this.data.subjects).filter(subj =>
                    (subj.notes && Object.keys(subj.notes).some(topicId => subj.notes[topicId] && subj.notes[topicId].trim() !== '')) ||
                    (subj.topicImages && Object.keys(subj.topicImages).some(topicId => subj.topicImages[topicId]?.length > 0))
                );

                document.getElementById('app-container').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full p-4">
                        <div class="text-center mb-8">
                            <i class="fas fa-graduation-cap text-6xl text-green-600 mb-4"></i>
                            <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome to the CBT Portal</h2>
                            <p class="text-gray-600">Select your role to continue</p>
                        </div>

                        ${subjectsWithNotes.length > 0 ? `
                        <div class="w-full max-w-2xl mb-6">
                            <h3 class="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
                                <i class="fas fa-book-open text-blue-500"></i>
                                Available Study Materials
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                ${subjectsWithNotes.map(subj => {
                                    const noteCount = subj.notes ? Object.keys(subj.notes).filter(t => subj.notes[t]?.trim()).length : 0;
                                    const imageCount = subj.topicImages ? Object.values(subj.topicImages).flat().length : 0;
                                    return `
                                        <div onclick="event.preventDefault(); app.showSubjectNotes('${subj.id}')" class="note-card cursor-pointer">
                                            <i class="fas fa-book"></i>
                                            <h4 class="font-bold">${subj.name}</h4>
                                            <p class="text-sm opacity-90">${noteCount} topics with notes, ${imageCount} topic images</p>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        ` : ''}

                        <div class="grid grid-cols-1 md:grid-cols-1 gap-6 w-full max-w-md">
                            <button onclick="event.preventDefault(); app.showCandidateOptions()" class="group bg-white p-8 rounded-xl shadow-md hover:shadow-xl transition border text-center">
                                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:bg-blue-200">
                                    <i class="fas fa-user-graduate text-2xl text-blue-600"></i>
                                </div>
                                <h3 class="text-xl font-bold text-gray-800">Candidate</h3>
                                <p class="text-gray-500 mt-2">Take the examination</p>
                            </button>
                        </div>
                    </div>`;
            },

            // ============================================================
            // STUDY MATERIALS (Notes & Images)
            // ============================================================

            showSubjectNotes: function(subjectId) {
                const subj = this.data.subjects[subjectId];
                if (!subj) return;

                const topicsWithMaterials = subj.topics.filter(t =>
                    (subj.notes && subj.notes[t.id] && subj.notes[t.id].trim() !== '') ||
                    (subj.topicImages && subj.topicImages[t.id] && subj.topicImages[t.id].length > 0)
                );

                if (topicsWithMaterials.length === 0) {
                    this.showNotification('No notes or images available for this subject', 'info');
                    return;
                }

                this.data.mode = 'notes-browser';
                this.updateHeader();

                document.getElementById('app-container').innerHTML = `
                    <div class="max-w-4xl mx-auto h-full flex flex-col">
                        <div class="flex items-center gap-2 mb-4">
                            <button onclick="event.preventDefault(); app.showLanding()" class="text-gray-500 hover:text-gray-800">
                                <i class="fas fa-arrow-left text-xl"></i>
                            </button>
                            <h2 class="text-2xl font-bold text-gray-800">${subj.name} - Study Materials</h2>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow overflow-y-auto pb-4">
                            ${topicsWithMaterials.map(t => {
                                const hasNote = subj.notes && subj.notes[t.id] && subj.notes[t.id].trim() !== '';
                                const hasImages = subj.topicImages && subj.topicImages[t.id] && subj.topicImages[t.id].length > 0;
                                return `
                                    <div class="bg-white p-6 rounded-lg shadow-md border hover:shadow-lg transition">
                                        <div class="flex items-center gap-3 mb-3">
                                            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                                                <i class="fas fa-folder-open text-blue-600"></i>
                                            </div>
                                            <h3 class="font-bold text-lg text-gray-800">${t.name}</h3>
                                        </div>
                                        <div class="flex flex-wrap gap-2">
                                            ${hasNote ? `
                                                <button onclick="event.preventDefault(); app.viewTopicNote('${subjectId}', '${t.id}', '${t.name}')" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-2 rounded text-sm font-bold">
                                                    <i class="fas fa-book-open mr-1"></i> Read Notes
                                                </button>
                                            ` : ''}
                                            ${hasImages ? `
                                                <button onclick="event.preventDefault(); app.viewTopicImages('${subjectId}', '${t.id}')" class="flex-1 bg-purple-50 hover:bg-purple-100 text-purple-700 px-3 py-2 rounded text-sm font-bold">
                                                    <i class="fas fa-images mr-1"></i> View Images (${subj.topicImages[t.id].length})
                                                </button>
                                            ` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            },

            viewTopicNote: function(subjectId, topicId, topicName) {
                const subj = this.data.subjects[subjectId];
                if (!subj || !subj.notes || !subj.notes[topicId]) {
                    this.showNotification('No notes available for this topic', 'info');
                    return;
                }

                document.getElementById('note-viewer-title').textContent = `Notes: ${topicName}`;
                document.getElementById('note-viewer-content').innerHTML = subj.notes[topicId];
                document.getElementById('note-viewer-modal').classList.remove('hidden');

            renderCandidateTopics: function() {

                const container = document.getElementById('candidate-topics-container');

                    return;
                }

                let topicsHtml = `
                    <p class="mb-2 text-sm font-bold text-gray-700">Select Topics & Choose Number of Questions</p>
                    <div class="grid grid-cols-1 gap-3 max-h-60 overflow-y-auto border p-3 rounded bg-white">
                `;

                subj.topics.forEach(topic => {
                    const questionCount = subj.questions.filter(q => q.topicId === topic.id).length;
                    const hasNote = subj.notes && subj.notes[topic.id] && subj.notes[topic.id].trim() !== '';
                    const hasImages = subj.topicImages && subj.topicImages[topic.id] && subj.topicImages[topic.id].length > 0;

                    topicsHtml += `
                        <div class="flex flex-col gap-2 p-3 border rounded-lg bg-gray-50 hover:bg-gray-100">
                            <div class="flex items-center gap-2 flex-wrap">
                                <input type="checkbox" name="exam-topic" value="${topic.id}" class="topic-checkbox rounded text-green-600 w-5 h-5">
                                <span class="text-sm font-bold text-gray-800 flex-grow">${topic.name}</span>
                                ${hasNote ? `<button type="button" onclick="event.preventDefault(); app.viewTopicNote('${subj.id}', '${topic.id}', '${topic.name}')" class="text-blue-500 hover:text-blue-700" title="View notes"><i class="fas fa-book-open"></i></button>` : ''}
                                ${hasImages ? `<button type="button" onclick="event.preventDefault(); app.viewTopicImages('${subj.id}', '${topic.id}')" class="text-purple-500 hover:text-purple-700" title="View images"><i class="fas fa-images"></i></button>` : ''}
                            </div>
                            <div class="flex items-center gap-3 text-sm ml-6">
                                <span class="text-gray-600"><i class="fas fa-database"></i> Available: <strong class="text-green-700">${questionCount}</strong> questions</span>
                                <div class="flex items-center gap-2">
                                    <label class="text-gray-600">Take:</label>
                                    <input type="number"
                                           class="topic-quantity w-20 border rounded px-2 py-1 text-center text-sm"
                                           data-topic-id="${topic.id}"
                                           min="0"
                                           max="${questionCount}"
                                           value="${questionCount}"
                                           step="1"
                                           ${questionCount === 0 ? 'disabled' : ''}>
                                    <span class="text-xs text-gray-500">questions</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                topicsHtml += `</div>`;
                container.innerHTML = topicsHtml;

                // Event listeners for checkbox/quantity sync
                document.querySelectorAll('.topic-checkbox').forEach(checkbox => {
                    const topicId = checkbox.value;
                    const qtyInput = document.querySelector(`.topic-quantity[data-topic-id="${topicId}"]`);
                    if (qtyInput) {
                        const updateQtyState = () => {
                            if (checkbox.checked) {
                                qtyInput.disabled = false;
                                let currentVal = parseInt(qtyInput.value);
                                let maxVal = parseInt(qtyInput.max);
                                if (isNaN(currentVal) || currentVal < 1) qtyInput.value = 1;
                                if (currentVal > maxVal) qtyInput.value = maxVal;
                            } else {
                                qtyInput.disabled = true;
                                qtyInput.value = 0;
                            }
                        };
                        checkbox.addEventListener('change', updateQtyState);
                        qtyInput.addEventListener('input', function() {
                            let val = parseInt(this.value);
                            let maxVal = parseInt(this.max);
                            if (isNaN(val)) val = 1;
                            if (val < 0) val = 0;
                            if (val > maxVal) val = maxVal;
                            this.value = val;
                            if (val === 0 && checkbox.checked) {
                                checkbox.checked = false;
                                this.disabled = true;
                            } else if (val > 0 && !checkbox.checked) {
                                checkbox.checked = true;
                                this.disabled = false;
                            }
                        });
                        updateQtyState();
                    }
                });
            },

            // ============================================================
            // START EXAM
            // ============================================================

            startTestPrep: function() {
                const nameInput = document.getElementById('candidate-name');
                const subjectInput = document.getElementById('exam-subject');

                if (nameInput) this.data.candidateName = nameInput.value;
                if (!subjectInput) { this.showNotification('No subject selected.', 'error'); return; }

                const subject = this.data.subjects[subjectInput.value];
                this.data.currentSubjectId = subjectInput.value;

                // Custom duration
                let customDurationMinutes = null;
                if (this.data.examMode === 'practice') {
                    const customDurationInput = document.getElementById('custom-duration-input');
                    if (customDurationInput && customDurationInput.value) {
                        const parsed = parseInt(customDurationInput.value, 10);
                        if (!isNaN(parsed) && parsed > 0 && parsed <= 999) {
                            customDurationMinutes = parsed;
                        }
                    }
                }

                // Gather topic selections and quantities
                const selectedTopics = [];
                const topicQuantityMap = {};

                document.querySelectorAll('input[name="exam-topic"]:checked').forEach(cb => {
                    const topicId = cb.value;
                    const qtyInput = document.querySelector(`.topic-quantity[data-topic-id="${topicId}"]`);
                    let qty = qtyInput ? parseInt(qtyInput.value) : 0;
                    if (isNaN(qty) || qty < 0) qty = 0;
                    if (qty > 0) {
                        selectedTopics.push(topicId);
                        topicQuantityMap[topicId] = qty;
                    }
                });

                let questionsToUse = [];

                if (selectedTopics.length === 0) {
                    questionsToUse = [...subject.questions];
                } else {
                    for (let topicId of selectedTopics) {
                        const topicQuestions = subject.questions.filter(q => q.topicId === topicId);
                        const requested = topicQuantityMap[topicId];
                        if (topicQuestions.length === 0) continue;
                        let numberOfQuestions = Math.min(requested, topicQuestions.length);
                        if (numberOfQuestions <= 0) continue;
                        const shuffled = [...topicQuestions];
                        for (let i = shuffled.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                        }
                        const selected = shuffled.slice(0, numberOfQuestions);
                        questionsToUse.push(...selected);
                    }
                }

                if (questionsToUse.length === 0) {
                    this.showNotification("No questions available.", "error");
                    return;
                }

                // Final shuffle
                for (let i = questionsToUse.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questionsToUse[i], questionsToUse[j]] = [questionsToUse[j], questionsToUse[i]];
                }

                this.data.questions = questionsToUse;

                if (this.data.examMode === 'practice') {
                    if (customDurationMinutes !== null) {
                        this.data.examDuration = customDurationMinutes;
                    } else {
                        this.data.examDuration = subject.duration;
                    }
                }

                if (this.data.questions.length === 0) {
                    this.showNotification("No questions set.", "error");
                    return;
                }

                this.data.currentQuestionIndex = 0;
                this.data.userAnswers = {};
                this.data.answerRevealed = {};

                if (this.data.examMode === 'practice') {
                    this.data.timeLeft = this.data.examDuration * 60;
                    this.startTimer();
                } else {
                    this.data.timeLeft = 0;
                }

                this.data.refreshLocked = true;
                document.body.style.overflow = 'hidden';
                document.documentElement.style.overflow = 'hidden';

                this.showTestInterface();
            },

            // ============================================================
            // TIMER
            // ============================================================

            startTimer: function() {
                if (this.data.timer) clearInterval(this.data.timer);
                this.data.timer = setInterval(() => {
                    this.data.timeLeft--;
                    this.updateTimerDisplay();
                    if (this.data.timeLeft <= 0) this.submitTest();
                }, 1000);
            },

            stopTimer: function() {
                if (this.data.timer) clearInterval(this.data.timer);
            },

            updateTimerDisplay: function() {
                const el = document.getElementById('timer-display');
                if (el) {
                    const m = Math.floor(this.data.timeLeft / 60);
                    const s = this.data.timeLeft % 60;
                    el.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    if (this.data.timeLeft < 60) el.classList.add('text-red-500', 'animate-pulse');
                }
            },

            // TEST INTERFACE
            // ============================================================

            showTestInterface: function() {
                this.data.mode = 'test';
                this.updateHeader();
                this.renderQuestion();
            },

            // ============================================================

            checkAnswer: function(qId, selectedValue) {
                const q = this.data.questions.find(q => q.id === qId);
                if (!q) return false;

                if (q.type === 'objective') {
                    return selectedValue && selectedValue.toUpperCase() === q.correct.toUpperCase();
                } else {
                    return selectedValue && selectedValue.toLowerCase().trim() === q.correct.toLowerCase().trim();
                }
            },

            handleStudyAnswerClick: function(qId, selectedValue, isFill = false) {
                if (isFill) {
                    const input = document.getElementById(`fill-answer-${qId}`);
                    if (input) {
                        selectedValue = input.value;
                    }
                }

                if (selectedValue !== undefined && selectedValue !== '') {
                    this.data.userAnswers[qId] = selectedValue;
                }

                this.data.answerRevealed[qId] = true;
                this.renderQuestion();
            },

            selectAnswer: function(qId, value) {
                this.data.userAnswers[qId] = value;

            // NAVIGATION
            // ============================================================

            nextQuestion: function() {
                if (this.data.currentQuestionIndex < this.data.questions.length - 1) {
                    this.data.currentQuestionIndex++;
                    this.renderQuestion();
                }
            },

            prevQuestion: function() {
                if (this.data.currentQuestionIndex > 0) {
                    this.data.currentQuestionIndex--;

            // ============================================================

            // ============================================================

            submitTestConfirm: function() {
                if (confirm("Submit? You cannot return once submitted.")) this.submitTest();
            },

            submitTest: function() {
                this.stopTimer();

                let score = 0;
                const details = [];

                this.data.questions.forEach(q => {
                    const userAns = this.data.userAnswers[q.id];
                    let isCorrect = false;

                    if (userAns !== undefined && userAns !== '') {
                        if (q.type === 'objective') {
                            isCorrect = userAns.toUpperCase() === q.correct.toUpperCase();
                        } else {
                            isCorrect = userAns.toLowerCase().trim() === q.correct.toLowerCase().trim();
                        }
                    }

                    if (isCorrect) score++;

                    details.push({
                        question: q.text,
                        userAnswer: userAns || 'Not Answered',
                        correctAnswer: q.correct,
                        isCorrect,
                        questionType: q.type,
                        options: q.options,
                        explanation: q.explanation
                    });
                });

                const total = this.data.questions.length;
                const percentage = Math.round((score / total) * 100);
                const subjectName = this.data.subjects[this.data.currentSubjectId]?.name || 'General';

                this.data.lastResults = {
                    name: this.data.candidateName,
                    subjectName,
                    score,
                    total,
                    percentage,
                    date: new Date().toISOString(),
                    details,
                    examMode: this.data.examMode
                };

                this.data.results.push(this.data.lastResults);
                this.saveResults();

                this.showSimplifiedResult(score, total, percentage);
            },

            // ============================================================

            // ============================================================

            setupMathJaxPatch: function() {
                // Patch app methods to trigger MathJax after content updates
                const methods = ['renderQuestion', 'showResult', 'showFullReview', 'viewTopicNote', 'showSubjectDashboard', 'showLanding', 'showTestInterface'];
                methods.forEach(methodName => {
                    if (this[methodName]) {
                        const original = this[methodName];
                        this[methodName] = function() {
                            const result = original.apply(this, arguments);
                            setTimeout(() => this.triggerMathJax(), 200);
                            return result;
                        };
                    }
                });
            },

            triggerMathJax: function() {
                if (window.MathJax && MathJax.typesetPromise) {
                    const container = document.getElementById('app-container');
                    if (container) {
                        MathJax.typesetPromise([container]).catch(err => {
                            console.warn('MathJax typeset error:', err);
                        });
                    }
                }
            },

            // ============================================================
            // ENCOURAGEMENT VERSE POPUP
            // ============================================================

            showVersePopup: function() {
                const results = this.data.results;
                if (!results || results.length === 0) return;

                const lastResult = results[results.length - 1];
                const percentage = lastResult.percentage;

                if (percentage === undefined) return;

                const VERSES_GOOD = [
                    "🌟 'Well done, good and faithful servant! You have been faithful over a little; I will set you over much.' — Matthew 25:21",
                    "🏆 'I can do all things through Christ who strengthens me.' — Philippians 4:13",
                    "📖 'Commit your work to the Lord, and your plans will be established.' — Proverbs 16:3",
                    "✨ 'For I know the plans I have for you, declares the Lord, plans for welfare and not for evil, to give you a future and a hope.' — Jeremiah 29:11"
                ];

                const VERSES_TRY_AGAIN = [
                    "💪 'Do not be discouraged, for the Lord your God is with you wherever you go.' — Joshua 1:9",
                    "🌅 'For though the righteous fall seven times, they rise again.' — Proverbs 24:16",
                    "🙏 'But those who hope in the Lord will renew their strength.' — Isaiah 40:31",
                    "❤️ 'My grace is sufficient for you, for my power is made perfect in weakness.' — 2 Corinthians 12:9"
                ];

                const isGood = percentage >= 50;
                const verses = isGood ? VERSES_GOOD : VERSES_TRY_AGAIN;
                const randomVerse = verses[Math.floor(Math.random() * verses.length)];

                const title = isGood ? '🎉 Congratulations! 🎉' : '💪 Keep Going! 💪';
                const icon = isGood ? '🎓✨' : '🌱💪';
                const bgColor = isGood ? '#1e3c2c' : '#2d2b1f';
                const accentColor = isGood ? '#ffd700' : '#ffaa66';

                const popup = document.createElement('div');
                popup.id = 'verse-popup';
                popup.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.75);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 999999;
                    backdrop-filter: blur(5px);
                `;

                popup.innerHTML = `
                    <div style="
                        background: linear-gradient(135deg, ${bgColor}, ${isGood ? '#2a6b3c' : '#6b4c14'});
                        max-width: 500px;
                        width: 90%;
                        border-radius: 24px;
                        padding: 30px 25px;
                        text-align: center;
                        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
                        border: 2px solid ${accentColor};
                        animation: slideUpVerse 0.4s ease-out;
                        color: white;
                    ">
                        <div style="font-size: 60px; margin-bottom: 10px;">${icon}</div>
                        <h2 style="font-size: 28px; margin: 0 0 15px; color: ${accentColor};">${title}</h2>
                        <div style="
                            background: rgba(255,255,255,0.12);
                            border-radius: 16px;
                            padding: 20px;
                            margin: 20px 0;
                            font-size: 18px;
                            line-height: 1.6;
                            font-style: italic;
                            border-left: 4px solid ${accentColor};
                        ">
                            ${randomVerse}
                        </div>
                        <button onclick="this.closest('#verse-popup').remove()" style="
                            background: ${accentColor};
                            color: ${isGood ? '#1e3c2c' : '#2d2b1f'};
                            border: none;
                            padding: 12px 28px;
                            border-radius: 40px;
                            font-size: 16px;
                            font-weight: bold;
                            cursor: pointer;
                            transition: transform 0.2s;
                        " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                            Continue
                        </button>
                    </div>
                `;

                document.body.appendChild(popup);

                // Auto-close after 6 seconds
                setTimeout(() => {
                    if (popup && popup.parentNode) popup.remove();
                }, 6000);
            }
        };

        // ============================================================
        // INITIALIZE APP
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

        // ============================================================
        // FULL-SCREEN EXPLANATION VIEWER
        // ============================================================

        (function() {
            // Inject CSS for the full-screen viewer
            const style = document.createElement('style');
            style.textContent = `
                .blink-btn {
                    animation: blink-pulse 1.5s infinite ease-in-out;
                    background: #3b82f6 !important;
                    color: white !important;
                    border: none !important;
                    border-radius: 8px !important;
                    padding: 8px 14px !important;
                    font-size: 13px !important;
                    font-weight: bold !important;
                    cursor: pointer !important;
                    margin-top: 12px !important;
                    margin-bottom: 4px !important;
                    display: inline-flex !important;
                    align-items: center !important;
                    gap: 6px !important;
                    box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3) !important;
                    transition: transform 0.2s, background 0.2s !important;
                }
                .blink-btn:hover {
                    transform: scale(1.05) !important;
                    animation: none !important;
                    background: #2563eb !important;
                    box-shadow: 0 6px 12px rgba(59, 130, 246, 0.4) !important;
                }
                @keyframes blink-pulse {
                    0%, 100% { opacity: 1; background: #3b82f6; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
                    50% { opacity: 0.6; background: #2563eb; box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
                }

                #fullscreen-explain-modal {
                    position: fixed; inset: 0; z-index: 9999999; background: rgba(0, 0, 0, 0.85);
                    display: none; align-items: center; justify-content: center; padding: 20px;
                    backdrop-filter: blur(4px);
                }
                #fullscreen-explain-modal.open { display: flex; }

                #fullscreen-explain-modal .modal-content {
                    background: white;
                    max-width: 95vw !important;
                    max-height: 95vh !important;
                    width: 100%;
                    padding: 25px !important;
                    border-radius: 16px;
                    overflow-y: auto;
                    position: relative;
                    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
                    animation: scaleUp 0.3s ease-out;
                    color: #1e293b;
                }
                @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

                #fullscreen-explain-modal .close-btn,
                #fullscreen-explain-modal .theme-toggle-btn {
                    position: absolute; top: 12px; background: #f3f4f6;
                    border: none; border-radius: 50%; width: 36px; height: 36px;
                    font-size: 18px; cursor: pointer; transition: 0.2s; color: #374151;
                    display: flex; align-items: center; justify-content: center;
                }
                #fullscreen-explain-modal .close-btn { right: 16px; }
                #fullscreen-explain-modal .theme-toggle-btn { right: 58px; }
                #fullscreen-explain-modal .close-btn:hover,
                #fullscreen-explain-modal .theme-toggle-btn:hover { background: #e5e7eb; transform: scale(1.1); }

                #fullscreen-explain-modal h2 {
                    font-size: 24px; font-weight: bold;
                    margin-bottom: 16px; border-bottom: 2px solid #3b82f6; padding-bottom: 12px;
                    padding-right: 70px;
                }
                #fullscreen-explain-body {
                    white-space: pre-wrap !important; line-height: 1.8 !important;
                    font-size: 16px !important;
                }

                #fullscreen-explain-modal .theme-white {
                    background: #ffffff !important; color: #1e293b !important;
                }
                #fullscreen-explain-modal .theme-white h2 { border-bottom-color: #3b82f6 !important; }

                #fullscreen-explain-modal .theme-dark {
                    background: #1a1a1a !important; color: #ffffff !important;
                }
                #fullscreen-explain-modal .theme-dark h2 { border-bottom-color: #818cf8 !important; }
                #fullscreen-explain-modal .theme-dark .close-btn,
                #fullscreen-explain-modal .theme-dark .theme-toggle-btn { background: #3b3b3b !important; color: #ffffff !important; }
                #fullscreen-explain-modal .theme-dark .close-btn:hover,
                #fullscreen-explain-modal .theme-dark .theme-toggle-btn:hover { background: #555 !important; }
                #fullscreen-explain-modal .theme-dark mjx-container,
                #fullscreen-explain-modal .theme-dark mjx-container * { color: #ffffff !important; }

                #fullscreen-explain-modal .theme-sepia {
                    background: #f5f0e6 !important; color: #3e2e1e !important;
                }
                #fullscreen-explain-modal .theme-sepia h2 { border-bottom-color: #d97706 !important; }
                #fullscreen-explain-modal .theme-sepia .close-btn,
                #fullscreen-explain-modal .theme-sepia .theme-toggle-btn { background: #e5dcd2 !important; color: #4a3b2c !important; }
                #fullscreen-explain-modal .theme-sepia .close-btn:hover,
                #fullscreen-explain-modal .theme-sepia .theme-toggle-btn:hover { background: #d4c9bb !important; }
            `;
            document.head.appendChild(style);

            // Open full-screen explanation
            window.openFullScreenExplanation = function(btnElement) {
                const container = btnElement.closest('.explanation-box, .bg-blue-50, .bg-white.p-4.rounded-lg.border-l-4');
                if (!container) return;
                const clone = container.cloneNode(true);
                const btnInClone = clone.querySelector('.fullscreen-explain-btn');
                if (btnInClone) btnInClone.remove();

                const modalContent = document.querySelector('#fullscreen-explain-modal .modal-content');
                modalContent.className = 'modal-content theme-white';

                document.getElementById('fullscreen-explain-body').innerHTML = clone.innerHTML;
                document.getElementById('fullscreen-explain-modal').classList.add('open');
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([document.getElementById('fullscreen-explain-body')]).catch(() => {});
                }
            };

            // Theme toggle
            window.toggleExplanationTheme = function(btnElement) {
                const modalContent = btnElement.closest('.modal-content');
                if (!modalContent) return;

                const themes = ['theme-white', 'theme-dark', 'theme-sepia'];
                let currentIndex = themes.findIndex(t => modalContent.classList.contains(t));
                let nextIndex = (currentIndex + 1) % themes.length;
                themes.forEach(t => modalContent.classList.remove(t));
                modalContent.classList.add(themes[nextIndex]);
            };

            // Inject buttons into explanation boxes
            function injectBlinkButtons() {
                document.querySelectorAll('.explanation-box').forEach(container => {
                    if (container.querySelector('.fullscreen-explain-btn')) return;

                    let target = container.querySelector('.bg-white.p-4.rounded-lg.border-l-4.border-blue-500');
                    if (!target) target = container.querySelector('.bg-blue-50');
                    if (!target) target = container;

                    if (target.querySelector('.fullscreen-explain-btn')) return;
                    if (target.textContent.trim().length < 5) return;

                    const btn = document.createElement('button');
                    btn.className = 'fullscreen-explain-btn blink-btn';
                    btn.innerHTML = '<i class="fas fa-expand"></i> View in full screen';
                    btn.onclick = function(e) {
                        e.preventDefault();
                        window.openFullScreenExplanation(this);
                    };
                    target.appendChild(btn);
                });

                // Remove buttons from green boxes
                document.querySelectorAll('.bg-green-50 .fullscreen-explain-btn').forEach(btn => btn.remove());
            }

            // Patch render methods
            const methodsToPatch = ['renderQuestion', 'showResult', 'showFullReview'];
            methodsToPatch.forEach(methodName => {
                const original = app[methodName];
                if (typeof original === 'function') {
                    app[methodName] = function() {
                        const result = original.apply(this, arguments);
                        setTimeout(injectBlinkButtons, 400);
                        return result;
                    };
                }
            });

            setTimeout(injectBlinkButtons, 500);
        })();
    </script>
        <!-- Question Bank Import -->
    <script src="question-bank.js" defer></script>
</body>
</html>
